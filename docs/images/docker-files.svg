<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><style>.t{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#1d3448}.h{font-size:30px;font-weight:700}.m{font-size:22px}.s{font-size:18px;fill:#526b7d}.card{stroke-width:3;rx:18}</style><rect width="1100" height="560" fill="#f7fafc"/><text x="550" y="55" text-anchor="middle" class="t h">部署文件与数据保存位置</text><rect class="card" x="70" y="105" width="420" height="365" fill="#e9f4ff" stroke="#3d8bd4"/><text x="105" y="155" class="t h">/opt/streamharbor/</text><text x="115" y="215" class="t m">├── docker-compose.yml</text><text x="150" y="250" class="t s">容器启动规则</text><text x="115" y="310" class="t m">└── .env</text><text x="150" y="345" class="t s">NAS 地址、媒体库路径、随机密钥</text><text x="105" y="420" class="t s">可从 GitHub Release 下载</text><rect class="card" x="610" y="105" width="420" height="365" fill="#edf9ef" stroke="#38a46b"/><text x="645" y="155" class="t h">宿主机 config 目录</text><text x="645" y="215" class="t m">/vol1/1000/docker/streamharbor/config</text><text x="675" y="270" class="t s">• pan115.db 数据库</text><text x="675" y="310" class="t s">• 115 Cookie 与 Web 配置</text><text x="675" y="350" class="t s">• 授权文件和运行状态</text><text x="645" y="420" class="t m">更新容器不会丢失</text><text x="550" y="525" text-anchor="middle" class="t m">升级前备份 config 目录；不要执行 docker compose down -v</text></svg>