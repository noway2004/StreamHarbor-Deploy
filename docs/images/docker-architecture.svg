<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><defs><style>.title{font:700 30px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#20364b}.sub{font:20px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#536a7d}.label{font:700 24px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#20364b}.small{font:18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#314b60}.box{stroke-width:3}.arrow{stroke:#4d7ea8;stroke-width:5;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4d7ea8"/></marker></defs><rect width="1200" height="460" fill="#f7fafc"/><text x="60" y="55" class="title">StreamHarbor 标准四容器部署</text><text x="60" y="88" class="sub">PostgreSQL + Redis + Celery Worker 全部由 Docker Compose 管理</text><rect x="70" y="160" width="240" height="150" rx="16" fill="#dff3ff" stroke="#268bd2" class="box"/><text x="125" y="215" class="label">StreamHarbor</text><text x="112" y="245" class="small">Web / Emby 网关</text><text x="112" y="270" class="small">NAS 主机网络</text><rect x="460" y="90" width="250" height="135" rx="16" fill="#ece5ff" stroke="#7b61c9" class="box"/><text x="520" y="145" class="label">PostgreSQL</text><text x="510" y="178" class="small">资源与配置数据</text><rect x="460" y="270" width="250" height="135" rx="16" fill="#ffe7d5" stroke="#e67e22" class="box"/><text x="545" y="325" class="label">Redis</text><text x="510" y="358" class="small">缓存 / Broker / Backend</text><rect x="860" y="160" width="250" height="150" rx="16" fill="#e3f6e9" stroke="#2e9d5b" class="box"/><text x="925" y="215" class="label">Celery Worker</text><text x="920" y="245" class="small">导入 / STRM 后台任务</text><text x="935" y="270" class="small">不会阻塞网页</text><path class="arrow" d="M315 200 H445"/><path class="arrow" d="M315 270 H445"/><path class="arrow" d="M715 315 H845"/></svg>
